<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Scramjet</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --accent: #00ff88;
        --accent-dim: rgba(0,255,136,.12);
        --accent-glow: rgba(0,255,136,.28);
        --accent-border: rgba(0,255,136,.4);
        color-scheme: dark;
      }
      html, body { width: 100%; min-height: 100%; }
      body {
        position: relative;
        display: grid;
        min-height: 100vh;
        place-items: center;
        overflow: hidden;
        color: #f2fff9;
        background: #020706;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      body::before {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: .25;
        pointer-events: none;
        background-image:
          linear-gradient(rgba(255,255,255,.026) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,.026) 1px, transparent 1px);
        background-size: 52px 52px;
        mask-image: radial-gradient(circle at 50% 45%, #000 0, transparent 72%);
        content: "";
      }
      body::after {
        position: fixed;
        inset: 0;
        z-index: 3;
        pointer-events: none;
        background: radial-gradient(circle at center, transparent 42%, rgba(0,0,0,.58) 115%);
        content: "";
      }
      .aurora {
        position: fixed;
        inset: -20%;
        z-index: 0;
        pointer-events: none;
        background:
          radial-gradient(ellipse 44% 38% at 28% 32%, var(--accent-glow), transparent 70%),
          radial-gradient(ellipse 38% 34% at 74% 62%, rgba(23,113,255,.16), transparent 70%),
          radial-gradient(ellipse 28% 26% at 78% 18%, rgba(151,64,255,.12), transparent 70%),
          linear-gradient(145deg, #020706, #07110f 50%, #03080a);
        filter: saturate(120%);
        animation: aurora 18s ease-in-out infinite alternate;
      }
      @keyframes aurora {
        from { transform: translate3d(-1%, -1%, 0) scale(1); }
        to { transform: translate3d(1.5%, 1%, 0) scale(1.035); }
      }
      #matrixCanvas {
        position: fixed;
        inset: 0;
        z-index: 0;
        opacity: 0;
        pointer-events: none;
        mix-blend-mode: screen;
        transition: opacity .5s ease;
        mask-image: linear-gradient(to bottom, rgba(0,0,0,.9), transparent 92%);
      }
      #matrixCanvas.active { opacity: .22; }
      .particles { position: fixed; inset: 0; z-index: 0; pointer-events: none; }
      .particle {
        position: absolute;
        width: 2px;
        height: 2px;
        border-radius: 50%;
        opacity: 0;
        background: var(--accent);
        box-shadow: 0 0 8px var(--accent);
        animation: floatParticle linear infinite;
      }
      @keyframes floatParticle {
        0% { opacity: 0; transform: translateY(0) translateX(0) scale(.4); }
        15% { opacity: .5; }
        85% { opacity: .15; }
        100% { opacity: 0; transform: translateY(-140px) translateX(var(--dx,20px)) scale(1.5); }
      }
      .center {
        position: relative;
        z-index: 2;
        display: flex;
        width: min(720px, calc(100vw - 36px));
        flex-direction: column;
        align-items: center;
        gap: 28px;
        padding: 56px 54px 38px;
        border: 1px solid rgba(207,255,234,.12);
        border-top-color: rgba(235,255,246,.25);
        border-radius: 34px;
        background:
          linear-gradient(145deg, rgba(15,31,28,.72), rgba(5,12,13,.52));
        box-shadow:
          0 40px 110px rgba(0,0,0,.56),
          0 0 0 1px rgba(255,255,255,.025),
          inset 0 1px rgba(255,255,255,.08);
        backdrop-filter: blur(30px) saturate(150%);
      }
      .center::before {
        position: absolute;
        top: 0;
        right: 15%;
        left: 15%;
        height: 1px;
        background: linear-gradient(90deg, transparent, var(--accent), transparent);
        opacity: .58;
        content: "";
      }
      .wordmark {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 9px;
      }
      .logo-emblem {
        position: relative;
        display: grid;
        width: 66px;
        height: 66px;
        margin-bottom: 6px;
        place-items: center;
        border-radius: 22px;
        background: radial-gradient(circle, var(--accent-dim), transparent 68%);
        filter: drop-shadow(0 0 22px var(--accent-glow));
      }
      .logo-ring {
        position: absolute;
        border: 1.5px solid transparent;
        border-radius: 22px;
      }
      .ring-outer {
        inset: 1px;
        border-top-color: var(--accent);
        border-right-color: var(--accent-border);
        animation: spinCW 5s linear infinite;
      }
      .ring-inner {
        inset: 12px;
        border-bottom-color: var(--accent);
        border-left-color: var(--accent-border);
        border-radius: 13px;
        animation: spinCCW 3.6s linear infinite;
      }
      .logo-core {
        width: 17px;
        height: 17px;
        border: 4px solid rgba(0,0,0,.46);
        border-radius: 6px;
        background: var(--accent);
        box-shadow: 0 0 18px var(--accent), 0 0 44px var(--accent-glow);
        transform: rotate(45deg);
        animation: corePulse 2.2s ease-in-out infinite;
      }
      @keyframes spinCW { to { transform: rotate(360deg); } }
      @keyframes spinCCW { to { transform: rotate(-360deg); } }
      @keyframes corePulse {
        50% { opacity: .7; transform: rotate(135deg) scale(.84); }
      }
      .logo-text {
        color: #fff;
        font-size: clamp(3rem, 7vw, 4.35rem);
        font-weight: 820;
        letter-spacing: -.075em;
        line-height: .95;
        background: linear-gradient(115deg, #fff 22%, #caffdf 48%, var(--accent) 78%, #54a8ff);
        background-clip: text;
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        filter: drop-shadow(0 8px 28px rgba(0,0,0,.34));
      }
      .logo-sub {
        color: rgba(218,242,232,.42);
        font-size: .66rem;
        font-weight: 720;
        letter-spacing: .22em;
        text-transform: uppercase;
      }
      .search-wrap { width: 100%; }
      .search-pill {
        display: flex;
        width: 100%;
        align-items: center;
        gap: 12px;
        padding: 10px 11px 10px 17px;
        border: 1px solid rgba(219,255,240,.16);
        border-top-color: rgba(235,255,246,.28);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,.09), rgba(255,255,255,.035));
        box-shadow: 0 18px 50px rgba(0,0,0,.3), inset 0 1px rgba(255,255,255,.08);
        backdrop-filter: blur(24px);
        transition: border-color .2s ease, box-shadow .2s ease, transform .2s ease;
      }
      .search-pill:focus-within {
        border-color: var(--accent-border);
        box-shadow:
          0 0 0 4px var(--accent-dim),
          0 20px 60px rgba(0,0,0,.38),
          inset 0 1px rgba(255,255,255,.12);
        transform: translateY(-2px);
      }
      .search-icon {
        display: flex;
        flex-shrink: 0;
        align-items: center;
        color: rgba(224,244,236,.38);
        transition: color .2s ease;
      }
      .search-pill:focus-within .search-icon { color: var(--accent); }
      .search-icon svg {
        width: 19px; height: 19px; fill: none; stroke: currentColor;
        stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      }
      .search-input {
        min-width: 0;
        flex: 1;
        padding: 7px 0;
        border: 0;
        outline: 0;
        color: #f5fff9;
        background: transparent;
        caret-color: var(--accent);
        font: 480 1rem/1.3 inherit;
      }
      .search-input::placeholder { color: rgba(218,238,230,.3); }
      .search-btn {
        min-width: 72px;
        padding: 10px 18px;
        border: 1px solid var(--accent-border);
        border-radius: 12px;
        color: #021008;
        background: linear-gradient(135deg, #a8ffd0, var(--accent));
        box-shadow: 0 8px 24px var(--accent-glow), inset 0 1px rgba(255,255,255,.5);
        cursor: pointer;
        font: 760 .78rem/1 inherit;
        letter-spacing: .02em;
        transition: transform .16s ease, box-shadow .16s ease, filter .16s ease;
      }
      .search-btn:hover {
        filter: brightness(1.08);
        transform: translateY(-1px);
        box-shadow: 0 12px 30px var(--accent-glow);
      }
      .search-btn:active { transform: translateY(0) scale(.97); }
      .quick-links {
        display: grid;
        width: 100%;
        grid-template-columns: repeat(6, 1fr);
        gap: 8px;
      }
      .quick-link {
        display: flex;
        min-width: 0;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        padding: 13px 8px 11px;
        border: 1px solid rgba(255,255,255,.075);
        border-radius: 13px;
        color: rgba(230,247,240,.54);
        background: rgba(255,255,255,.03);
        text-decoration: none;
        font: 620 .68rem/1 inherit;
        transition: color .18s ease, background .18s ease, border-color .18s ease, transform .18s ease, box-shadow .18s ease;
      }
      .quick-link:hover {
        border-color: var(--accent-border);
        color: #effff7;
        background: var(--accent-dim);
        box-shadow: 0 12px 30px rgba(0,0,0,.22);
        transform: translateY(-3px);
      }
      .quick-link img {
        width: 20px;
        height: 20px;
        flex-shrink: 0;
        border-radius: 5px;
        filter: saturate(.78);
        opacity: .86;
      }
      .version-badge {
        color: rgba(220,241,232,.2);
        font: 500 .61rem/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
        letter-spacing: .03em;
        text-align: center;
      }
      .version-badge a { color: rgba(220,241,232,.32); text-decoration: none; }
      .version-badge a:hover { color: var(--accent); }
      button:focus-visible, a:focus-visible, input:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      @media (max-width: 650px) {
        .center { gap: 23px; padding: 38px 20px 26px; border-radius: 26px; }
        .logo-emblem { width: 56px; height: 56px; }
        .quick-links { grid-template-columns: repeat(3, 1fr); }
      }
      @media (max-width: 430px) {
        .search-pill { padding-left: 14px; }
        .search-btn { min-width: auto; padding-inline: 14px; }
        .logo-sub { letter-spacing: .16em; }
      }
      @media (prefers-reduced-motion: reduce) {
        .aurora, .logo-ring, .logo-core, .particle { animation: none; }
        .search-pill, .quick-link, .search-btn { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="aurora"></div>
    <canvas id="matrixCanvas"></canvas>
    <div class="particles" id="particles"></div>

    <div class="center">
      <div class="wordmark">
        <div class="logo-emblem">
          <div class="logo-ring ring-outer"></div>
          <div class="logo-ring ring-inner"></div>
          <div class="logo-core"></div>
        </div>
        <span class="logo-text">Scramjet</span>
        <span class="logo-sub">Web Proxy Engine</span>
      </div>

      <div class="search-wrap">
        <form id="searchForm">
          <div class="search-pill">
            <span class="search-icon">
              <svg viewBox="0 0 24 24">
                <circle cx="11" cy="11" r="7" />
                <line x1="16.5" y1="16.5" x2="22" y2="22" />
              </svg>
            </span>
            <input
              class="search-input"
              id="searchInput"
              type="text"
              placeholder="Search the web or enter a URL..."
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="search-btn">Go</button>
          </div>
        </form>
      </div>

      <div class="quick-links">
        <a class="quick-link" href="#" data-url="https://google.com">
          <img
            src="https://www.google.com/s2/favicons?domain=google.com&sz=32"
            alt=""
            onerror="this.style.display='none'"
          />
          Google
        </a>
        <a class="quick-link" href="#" data-url="https://youtube.com">
          <img
            src="https://www.google.com/s2/favicons?domain=youtube.com&sz=32"
            alt=""
            onerror="this.style.display='none'"
          />
          YouTube
        </a>
        <a class="quick-link" href="#" data-url="https://github.com">
          <img
            src="https://www.google.com/s2/favicons?domain=github.com&sz=32"
            alt=""
            onerror="this.style.display='none'"
          />
          GitHub
        </a>
        <a class="quick-link" href="#" data-url="https://wikipedia.org">
          <img
            src="https://www.google.com/s2/favicons?domain=wikipedia.org&sz=32"
            alt=""
            onerror="this.style.display='none'"
          />
          Wikipedia
        </a>
        <a class="quick-link" href="#" data-url="https://reddit.com">
          <img
            src="https://www.google.com/s2/favicons?domain=reddit.com&sz=32"
            alt=""
            onerror="this.style.display='none'"
          />
          Reddit
        </a>
        <a class="quick-link" href="#" data-url="https://discord.com">
          <img
            src="https://www.google.com/s2/favicons?domain=discord.com&sz=32"
            alt=""
            onerror="this.style.display='none'"
          />
          Discord
        </a>
      </div>

      <div class="version-badge">
        v{{SCRAMJET_VERSION}} &middot;
        <a
          href="https://github.com/MercuryWorkshop/scramjet/commit/{{SCRAMJET_BUILD}}"
          target="_blank"
          >{{SCRAMJET_BUILD}}</a
        >
        &middot; {{SCRAMJET_DATE_PRETTY}}
      </div>
    </div>

    <script>
      // Read theme from parent localStorage if possible
      try {
        var stored = localStorage.getItem("scramjet-appearance");
        if (stored) {
          var app = JSON.parse(stored);
          var themes = {
            "cyber-green": {
              accent: "#00ff88",
              glow: "rgba(0,255,136,0.28)",
              border: "rgba(0,255,136,0.4)",
              dim: "rgba(0,255,136,0.12)",
            },
            classic: {
              accent: "#a078ff",
              glow: "rgba(160,120,255,0.28)",
              border: "rgba(160,120,255,0.4)",
              dim: "rgba(160,120,255,0.12)",
            },
            "midnight-blue": {
              accent: "#00a8ff",
              glow: "rgba(0,168,255,0.28)",
              border: "rgba(0,168,255,0.4)",
              dim: "rgba(0,168,255,0.12)",
            },
            "purple-neon": {
              accent: "#bf5fff",
              glow: "rgba(191,95,255,0.28)",
              border: "rgba(191,95,255,0.4)",
              dim: "rgba(191,95,255,0.12)",
            },
            "ice-glass": {
              accent: "#88d8ff",
              glow: "rgba(136,216,255,0.22)",
              border: "rgba(136,216,255,0.35)",
              dim: "rgba(136,216,255,0.1)",
            },
            "hacker-terminal": {
              accent: "#00ff41",
              glow: "rgba(0,255,65,0.26)",
              border: "rgba(0,255,65,0.38)",
              dim: "rgba(0,255,65,0.1)",
            },
          };
          var t = themes[app.theme] || themes["cyber-green"];
          document.documentElement.style.setProperty("--accent", t.accent);
          document.documentElement.style.setProperty("--accent-glow", t.glow);
          document.documentElement.style.setProperty(
            "--accent-border",
            t.border,
          );
          document.documentElement.style.setProperty("--accent-dim", t.dim);
        }
      } catch (e) {}
      // Always run the welcome-page rain, even before appearance settings exist.
      document.getElementById("matrixCanvas").classList.add("active");
      startMatrix();

      function navigate(raw) {
        var url = raw.trim();
        if (!url) return;
        if (!/^[a-zA-Z][a-zA-Z\d+\-.]*:\/\//.test(url)) {
          if (/^[\w-]+(\.[\w-]+)+(\/|$)/.test(url)) {
            url = "https://" + url;
          } else {
            url = "https://www.google.com/search?q=" + encodeURIComponent(url);
          }
        }
        window.parent.postMessage({ type: "scramjet-navigate", url: url }, "*");
      }

      document
        .getElementById("searchForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          navigate(document.getElementById("searchInput").value);
        });

      document.querySelectorAll(".quick-link").forEach(function (el) {
        el.addEventListener("click", function (e) {
          e.preventDefault();
          navigate(el.dataset.url);
        });
      });

      // Floating particles
      var container = document.getElementById("particles");
      for (var i = 0; i < 18; i++) {
        (function (i) {
          var p = document.createElement("span");
          p.className = "particle";
          p.style.left = Math.random() * 100 + "%";
          p.style.bottom = Math.random() * 30 + "px";
          p.style.setProperty("--dx", (Math.random() - 0.5) * 60 + "px");
          p.style.animationDuration = 4 + Math.random() * 8 + "s";
          p.style.animationDelay = Math.random() * 8 + "s";
          p.style.width = p.style.height = 1 + Math.random() * 2 + "px";
          container.appendChild(p);
        })(i);
      }

      // Matrix rain
      function startMatrix() {
        var canvas = document.getElementById("matrixCanvas");
        var ctx = canvas.getContext("2d");
        if (!ctx) return;
        var ratio = Math.min(window.devicePixelRatio || 1, 2);
        var fontSize = 17;
        var columns = 0;
        var drops = [];
        var speeds = [];
        var trails = [];
        var chars =
          "アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF";
        var accent =
          getComputedStyle(document.documentElement)
            .getPropertyValue("--accent")
            .trim() || "#00ff88";
        function resize() {
          var width = window.innerWidth;
          var height = window.innerHeight;
          canvas.width = Math.floor(width * ratio);
          canvas.height = Math.floor(height * ratio);
          canvas.style.width = width + "px";
          canvas.style.height = height + "px";
          ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
          columns = Math.ceil(width / fontSize);
          drops = [];
          speeds = [];
          trails = [];
          for (var i = 0; i < columns; i++) {
            drops[i] = (Math.random() * -height) / fontSize;
            speeds[i] = 0.16 + Math.random() * 0.34;
            trails[i] = 6 + Math.floor(Math.random() * 11);
          }
        }
        resize();
        window.addEventListener("resize", resize);
        function draw() {
          var width = window.innerWidth;
          var height = window.innerHeight;
          ctx.fillStyle = "rgba(0, 4, 2, 0.13)";
          ctx.fillRect(0, 0, width, height);
          ctx.font = "14px ui-monospace, SFMono-Regular, Menlo, monospace";
          for (var i = 0; i < columns; i++) {
            var head = drops[i] * fontSize;
            var trail = trails[i];
            for (var step = 0; step < trail; step++) {
              var y = head - step * fontSize;
              if (y < -fontSize || y > height + fontSize) continue;
              var fade = 1 - step / trail;
              ctx.fillStyle =
                step === 0
                  ? "rgba(222, 255, 232, 0.96)"
                  : "rgba(0, " +
                    Math.floor(150 + fade * 105) +
                    ", " +
                    Math.floor(45 + fade * 90) +
                    ", " +
                    fade * 0.78 +
                    ")";
              ctx.shadowColor = accent;
              ctx.shadowBlur = step === 0 ? 9 : 2;
              ctx.fillText(
                chars[Math.floor(Math.random() * chars.length)],
                i * fontSize,
                y,
              );
            }
            ctx.shadowBlur = 0;
            if (head - trail * fontSize > height && Math.random() > 0.965)
              drops[i] = Math.random() * -24;
            drops[i] += speeds[i];
          }
          requestAnimationFrame(draw);
        }
        draw();
      }
    </script>
  </body>
</html>
