<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Secure Workspace</title>

    <!-- defer, not blocking: these two are ~470kB of classic script sitting
         between the parser and the rest of the document, so the browser used to
         download and execute both before it could lay out or paint anything.
         Nothing on the page reads $scramjet during parse (there are no inline
         scripts), and deferred classic scripts and module scripts execute in a
         single document-order list, so /index.tsx below still runs after both —
         the ordering the app relies on is unchanged. -->
    <script defer src="/scramjet/scramjet.js"></script>
    <script defer src="/controller/controller.api.js"></script>
    <style>
      /* Self-hosted rather than loaded from fonts.googleapis.com/fonts.gstatic.com:
         this app exists to route around network restrictions, so it can't
         depend on an external font CDN being reachable to render its own UI. */
      @font-face {
        font-family: "Material Symbols Outlined";
        font-style: normal;
        font-weight: 400;
        src: url("/fonts/material-symbols-outlined.ttf") format("truetype");
        font-display: block;
      }

      .material-symbols-outlined {
        font-family: "Material Symbols Outlined";
        font-weight: normal;
        font-style: normal;
        font-size: 24px;
        line-height: 1;
        letter-spacing: normal;
        text-transform: none;
        display: inline-block;
        white-space: nowrap;
        word-wrap: normal;
        direction: ltr;
        -webkit-font-smoothing: antialiased;
      }

      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        font-family:
          -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text",
          "Segoe UI", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      body {
        background: #060c0e;
        position: relative;
        overflow: hidden;
      }

      /* The active browser tab's <iframe> is a separately composited
         surface Chromium can paint above same-page overlays regardless of
         z-index. Any overlay that can appear above it (e.g. the Feature
         Flags panel) hides it for the duration via this class instead of
         fighting that compositor quirk. */
      body.flags-panel-open .browser-frame.active {
        visibility: hidden !important;
      }

      /* Aurora background — dims when browser content loads */
      body::before {
        content: "";
        position: fixed;
        inset: -25%;
        background:
          radial-gradient(
            ellipse 70% 55% at 12% 18%,
            rgba(0, 255, 136, 0.18) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse 60% 45% at 88% 8%,
            rgba(0, 180, 255, 0.14) 0%,
            transparent 50%
          ),
          radial-gradient(
            ellipse 80% 65% at 72% 92%,
            rgba(120, 40, 255, 0.12) 0%,
            transparent 55%
          ),
          radial-gradient(
            ellipse 55% 40% at 8% 82%,
            rgba(0, 255, 136, 0.08) 0%,
            transparent 48%
          ),
          radial-gradient(
            ellipse 50% 40% at 55% 45%,
            rgba(0, 200, 100, 0.06) 0%,
            transparent 50%
          );
        animation: aurora 24s ease-in-out infinite alternate;
        z-index: 0;
        pointer-events: none;
      }

      @keyframes aurora {
        0% {
          transform: translate(0%, 0%) scale(1);
        }
        25% {
          transform: translate(1.5%, -2%) scale(1.03);
        }
        50% {
          transform: translate(-1%, 1.5%) scale(0.97);
        }
        75% {
          transform: translate(2%, 1%) scale(1.02);
        }
        100% {
          transform: translate(-1%, -1.5%) scale(1.01);
        }
      }

      /* Scan lines — subtle CRT effect */
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: repeating-linear-gradient(
          0deg,
          transparent,
          transparent 2px,
          rgba(0, 0, 0, 0.025) 2px,
          rgba(0, 0, 0, 0.025) 4px
        );
        pointer-events: none;
        z-index: 0;
      }

      #app {
        position: relative;
        z-index: 1;
        width: 100%;
        height: 100vh;
      }

      /* Browser frames are created dynamically, outside Dreamland's scoped styles. */
      iframe.browser-frame {
        position: fixed !important;
        top: 81px !important;
        right: 0 !important;
        bottom: 0 !important;
        left: 0 !important;
        display: block !important;
        width: 100vw !important;
        height: calc(100vh - 81px) !important;
        min-width: 100vw !important;
        min-height: calc(100vh - 81px) !important;
        max-width: none !important;
        max-height: none !important;
        z-index: 3 !important;
        border: 0 !important;
      }

      iframe.browser-frame:not(.active) {
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
      }

      iframe.browser-frame.active {
        visibility: visible !important;
        opacity: 1 !important;
        pointer-events: auto !important;
      }

      .startup-error {
        display: grid;
        place-content: center;
        gap: 12px;
        width: 100%;
        height: 100%;
        padding: 24px;
        color: #e7fff5;
        text-align: center;
      }

      .startup-error h1 {
        font-size: clamp(1.35rem, 3vw, 2rem);
      }

      .startup-error p {
        max-width: 420px;
        color: #9fb5ad;
      }

      .startup-error-detail {
        color: #ff8a8a !important;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 0.8rem;
        overflow-wrap: anywhere;
      }

      .startup-error button {
        justify-self: center;
        padding: 10px 16px;
        border: 1px solid rgba(0, 255, 136, 0.45);
        border-radius: 10px;
        background: rgba(0, 255, 136, 0.12);
        color: #72ffb3;
        cursor: pointer;
        font: inherit;
      }

      .access-gate {
        position: relative;
        display: grid;
        place-items: center;
        width: 100%;
        height: 100%;
        overflow: hidden;
        color: #edfdf5;
        background:
          radial-gradient(
            circle at 15% 10%,
            rgba(0, 255, 136, 0.14),
            transparent 32%
          ),
          radial-gradient(
            circle at 88% 82%,
            rgba(0, 165, 255, 0.12),
            transparent 34%
          ),
          #050b0d;
      }

      .access-gate::before {
        content: "";
        position: absolute;
        inset: -20%;
        opacity: 0.13;
        background-image:
          linear-gradient(rgba(0, 255, 136, 0.16) 1px, transparent 1px),
          linear-gradient(90deg, rgba(0, 255, 136, 0.16) 1px, transparent 1px);
        background-size: 42px 42px;
        transform: perspective(500px) rotateX(58deg) translateY(18%);
        transform-origin: center bottom;
        mask-image: linear-gradient(to top, black, transparent 78%);
        pointer-events: none;
      }

      .access-card {
        position: relative;
        z-index: 1;
        display: grid;
        gap: 20px;
        width: min(420px, calc(100% - 32px));
        padding: 36px;
        border: 1px solid rgba(180, 255, 220, 0.18);
        border-top-color: rgba(220, 255, 238, 0.36);
        border-radius: 28px;
        background: linear-gradient(
          145deg,
          rgba(18, 33, 32, 0.82),
          rgba(5, 13, 17, 0.72)
        );
        box-shadow:
          0 30px 90px rgba(0, 0, 0, 0.48),
          0 0 0 1px rgba(0, 255, 136, 0.04);
        backdrop-filter: blur(24px) saturate(145%);
      }

      .access-brand {
        display: flex;
        align-items: center;
        gap: 10px;
        color: #b8ffda;
        font:
          700 0.74rem/1 system-ui,
          sans-serif;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      .access-brand-mark {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #00ff88;
        box-shadow: 0 0 18px rgba(0, 255, 136, 0.85);
      }

      .access-card h1 {
        margin: 0;
        font:
          750 clamp(1.8rem, 5vw, 2.5rem) / 1.05 system-ui,
          sans-serif;
        letter-spacing: -0.05em;
      }

      .access-card p {
        margin: 0;
        color: #91aaa2;
        font:
          400 0.92rem/1.55 system-ui,
          sans-serif;
      }

      .access-form {
        display: grid;
        gap: 10px;
      }

      .access-form label {
        color: #a9c0b8;
        font:
          650 0.72rem/1 system-ui,
          sans-serif;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .access-input {
        width: 100%;
        padding: 14px 15px;
        border: 1px solid rgba(200, 255, 225, 0.16);
        border-radius: 13px;
        outline: none;
        background: rgba(0, 0, 0, 0.22);
        color: #f4fff9;
        font:
          500 1rem/1 system-ui,
          sans-serif;
        letter-spacing: 0.12em;
        transition:
          border-color 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease;
      }

      .access-input:focus {
        border-color: rgba(0, 255, 136, 0.62);
        background: rgba(0, 0, 0, 0.3);
        box-shadow: 0 0 0 4px rgba(0, 255, 136, 0.1);
      }

      .access-submit {
        margin-top: 4px;
        padding: 13px 16px;
        border: 1px solid rgba(0, 255, 136, 0.52);
        border-radius: 13px;
        background: linear-gradient(
          135deg,
          rgba(0, 255, 136, 0.2),
          rgba(0, 170, 255, 0.14)
        );
        color: #bbffdc;
        cursor: pointer;
        font:
          700 0.86rem/1 system-ui,
          sans-serif;
        transition:
          transform 0.18s ease,
          box-shadow 0.18s ease,
          background 0.18s ease;
      }

      .access-submit:hover {
        background: linear-gradient(
          135deg,
          rgba(0, 255, 136, 0.3),
          rgba(0, 170, 255, 0.22)
        );
        box-shadow: 0 10px 28px rgba(0, 255, 136, 0.12);
        transform: translateY(-1px);
      }

      .access-submit:active {
        transform: translateY(0);
      }

      .access-message {
        min-height: 1.2em;
        color: #ff9f9f;
        font:
          500 0.78rem/1.4 system-ui,
          sans-serif;
      }

      .access-footnote {
        color: #60766f !important;
        font-size: 0.74rem !important;
      }

      @media (prefers-reduced-motion: reduce) {
        .access-submit {
          transition: none;
        }
      }
    </style>
    <script type="module" src="/index.tsx"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
