services:
  auth-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: scramjet_auth
      POSTGRES_USER: scramjet
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a strong local database password}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - auth-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scramjet -d scramjet_auth"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  auth-data:
