<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Scramjet Hub</title>
    <link rel="stylesheet" href="/index.css" />
    <meta name="robots" content="noindex, nofollow" />
    <script src="/bootstrap-init.js"></script>

    <!-- Premium Typography & Icons -->
    <link rel="preconnect" href="https://googleapis.com" />
    <link rel="preconnect" href="https://gstatic.com" crossorigin />
    <link href="https://googleapis.com" rel="stylesheet" />
    <link rel="stylesheet" href="https://jsdelivr.net" />

    <style>
      :root {
        --bg-dark: #06020c;
        --accent-primary: #8b5cf6;
        --accent-gradient: linear-gradient(135deg, #a78bfa 0%, #6d28d9 100%);
        --glass-bg: rgba(255, 255, 255, 0.02);
        --glass-border: rgba(255, 255, 255, 0.06);
        --glass-hover: rgba(255, 255, 255, 0.06);
        --text-main: #f8fafc;
        --text-muted: #94a3b8;
        --neon-glow: rgba(139, 92, 246, 0.25);
        --metric-good: #10b981;
      }

      * {
        box-sizing: border-box;
        user-select: none;
      }

      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        background-color: var(--bg-dark);
        color: var(--text-main);
        font-family: "Plus Jakarta Sans", sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        overflow-x: hidden;
        position: relative;
      }

      .nebula-bg {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        z-index: 1;
        pointer-events: none;
      }

      .glow-circle {
        position: absolute;
        border-radius: 50%;
        filter: blur(140px);
        opacity: 0.12;
        animation: float 25s infinite alternate ease-in-out;
      }

      .gc1 {
        width: 500px;
        height: 500px;
        background: #6d28d9;
        top: -10%;
        left: -10%;
      }
      .gc2 {
        width: 600px;
        height: 600px;
        background: #3b82f6;
        bottom: -15%;
        right: -10%;
        animation-delay: -5s;
      }
      .gc3 {
        width: 400px;
        height: 400px;
        background: #ec4899;
        top: 40%;
        left: 50%;
        animation-delay: -10s;
      }

      @keyframes float {
        0% {
          transform: translate(0, 0) scale(1);
        }
        100% {
          transform: translate(60px, 40px) scale(1.15);
        }
      }

      .app-wrapper {
        width: 100%;
        max-width: 950px;
        padding: 40px 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 40px;
        z-index: 10;
        flex-grow: 1;
        justify-content: center;
      }

      .brand-section {
        text-align: center;
        animation: fadeInDown 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .badge {
        background: linear-gradient(
          90deg,
          rgba(139, 92, 246, 0.12),
          rgba(59, 130, 246, 0.12)
        );
        border: 1px solid rgba(139, 92, 246, 0.25);
        padding: 6px 16px;
        border-radius: 100px;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 1px;
        text-transform: uppercase;
        color: #c084fc;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-bottom: 12px;
      }

      .brand-title {
        font-family: "Space Grotesk", sans-serif;
        font-size: 4.2rem;
        font-weight: 700;
        margin: 0;
        letter-spacing: -2px;
        background: linear-gradient(
          to right,
          #ffffff 30%,
          #c084fc 70%,
          #6366f1 100%
        );
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .omnibox-container {
        width: 100%;
        max-width: 720px;
        position: relative;
        animation: scaleUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.1s both;
      }

      .search-bar-wrapper {
        display: flex;
        align-items: center;
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 8px 12px;
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
        transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .search-bar-wrapper:focus-within {
        border-color: var(--accent-primary);
        box-shadow:
          0 0 30px var(--neon-glow),
          0 20px 40px rgba(0, 0, 0, 0.6);
        transform: translateY(-2px);
      }

      .search-icon-left {
        font-size: 1.3rem;
        color: var(--text-muted);
        padding: 0 12px;
      }

      #sj-address {
        flex-grow: 1;
        background: transparent !important;
        border: none !important;
        padding: 14px 4px;
        font-size: 1.15rem;
        font-family: inherit;
        color: var(--text-main) !important;
        outline: none !important;
      }

      .engine-selector {
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--glass-border);
        color: var(--text-main);
        padding: 10px 16px;
        border-radius: 16px;
        font-size: 0.9rem;
        font-weight: 500;
        cursor: pointer;
        outline: none;
        margin-right: 4px;
      }

      .dashboard-sections {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 36px;
        animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.2s both;
      }

      .section-header {
        font-size: 0.8rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 1.5px;
        color: var(--text-muted);
        margin-bottom: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .shortcuts-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(135px, 1fr));
        gap: 16px;
        width: 100%;
      }

      .shortcut-card {
        background: var(--glass-bg);
        border: 1px solid var(--glass-border);
        border-radius: 20px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        color: var(--text-main);
        text-decoration: none;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
      }

      .shortcut-card i {
        font-size: 1.8rem;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }

      .shortcut-card span {
        font-size: 0.9rem;
        font-weight: 500;
      }

      .shortcut-card:hover {
        background: var(--glass-hover);
        border-color: rgba(255, 255, 255, 0.15);
        transform: translateY(-4px);
        box-shadow: 0 12px 24px rgba(0, 0, 0, 0.3);
      }

      /* Dual Diagnostic Dashboard Grids */
      .telemetry-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 24px;
        width: 100%;
      }

      .dashboard-panel {
        background: rgba(0, 0, 0, 0.25);
        border: 1px solid var(--glass-border);
        border-radius: 24px;
        padding: 24px;
        backdrop-filter: blur(15px);
        -webkit-backdrop-filter: blur(15px);
      }

      .metrics-list {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .metric-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding-bottom: 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      }

      .metric-item:last-child {
        border-bottom: none;
        padding-bottom: 0;
      }

      .metric-meta {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .metric-meta i {
        font-size: 1.25rem;
        color: var(--accent-primary);
        width: 24px;
        text-align: center;
      }

      .metric-title {
        font-size: 0.85rem;
        color: var(--text-muted);
      }

      .metric-value {
        font-size: 0.95rem;
        font-weight: 600;
        color: var(--text-main);
        font-family: monospace;
      }

      .status-active {
        color: var(--metric-good) !important;
        font-weight: 700;
      }

      .desc,
      footer {
        display: none !important;
      }

      #sj-frame-wrapper {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        z-index: 99999;
        background: #000;
        display: none;
      }

      #sj-frame {
        width: 100%;
        height: 100%;
        border: none;
      }

      @keyframes fadeInDown {
        from {
          opacity: 0;
          transform: translateY(-20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      @keyframes scaleUp {
        from {
          opacity: 0;
          transform: scale(0.96);
        }
        to {
          opacity: 1;
          transform: scale(1);
        }
      }
      @keyframes fadeInUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>

  </body>
</html>
