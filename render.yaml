services:
  - type: web
    name: scrm-wisp
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - Dockerfile
        - render.yaml
        - wisp-server.ts
        - api/_lib/session.ts
        - api/_lib/auth-*.ts
        - api/_lib/face.ts
        - api/_lib/face-models.json
        - package.json
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - patches/**
    envVars:
      - key: WISP_SHARED_SECRET
        sync: false
      - key: WISP_TRUST_PROXY
        value: "1"
